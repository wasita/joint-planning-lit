[project]
name = "joint-planning-lit"
version = "0.1.0"
description = "Reading list vault, site generator, and helper notebooks for joint planning & multi-agent coordination"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
    "marimo>=0.24.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic-ai-slim>=2.41.0",
    "pyem",
    "ruff>=0.16.8",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pyem = { git = "https://github.com/shawnrhoads/pyEM.git" }
